[project]
name = "google-dashboard"
version = "0.1.0"
description = "Google Search Console Dashboard — full-stack analytics with OAuth 2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.36.0",
    "google-api-python-client>=2.152.0",
    "cryptography>=43.0.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "asyncmy>=0.2.9",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N815"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["aiosqlite", "asyncmy", "google_auth_oauthlib.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
